<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CDEAR - Country Climate Time Series</title>


<!-- =====================================================
     LEAFLET
===================================================== -->

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- =====================================================
     CHART.JS
===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js">
</script>


<!-- =====================================================
     PAGE STYLE
===================================================== -->

<style>

html,
body {

    height: 100%;

    margin: 0;

    font-family: Arial, sans-serif;

}


#container {

    display: flex;

    height: 100vh;

}


#map {

    width: 50%;

    height: 100%;

}


#panel {

    width: 50%;

    padding: 25px;

    box-sizing: border-box;

    overflow: auto;

}


#title {

    font-size: 24px;

    font-weight: bold;

}


#countryName {

    font-size: 20px;

    margin: 10px 0 15px;

}


#message {

    color: #666;

    margin-bottom: 20px;

}


.chart-container {

    height: 420px;

}


.info-box {

    margin-top: 20px;

    padding: 12px;

    background: #f5f5f5;

    border-radius: 5px;

}

</style>

</head>


<body>


<!-- =====================================================
     MAIN CONTAINER
===================================================== -->

<div id="container">


    <!-- MAP -->

    <div id="map"></div>


    <!-- RIGHT PANEL -->

    <div id="panel">


        <div id="title">
            CDEAR Climate Data
        </div>


        <div id="countryName">
            Select a country
        </div>


        <div id="message">
            Loading climate data...
        </div>


        <div class="chart-container">

            <canvas id="climateChart"></canvas>

        </div>


        <div class="info-box">

            <b>Variables</b>
            <br>

            P = Precipitation (mm/year)
            <br>

            PET = Potential Evapotranspiration (mm/year)
            <br>

            AET = Actual Evapotranspiration (mm/year)

        </div>


    </div>

</div>



<!-- =====================================================
     MAIN JAVASCRIPT
===================================================== -->

<script type="module">


/* =====================================================
   HYPARQUET ES MODULE

   IMPORTANT:
   Do NOT add another <script src="hyparquet...">
===================================================== */

import {

    asyncBufferFromUrl,

    parquetReadObjects

}
from
"https://cdn.jsdelivr.net/npm/hyparquet@1.30.1/+esm";



/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let map = L
    .map('map')
    .setView([0, 20], 3);


let chart = null;


let countryData = [];



/* =====================================================
   BASE MAP
===================================================== */

L.tileLayer(

    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

    {

        attribution:
            '&copy; OpenStreetMap contributors'

    }

).addTo(map);



/* =====================================================
   LOAD PARQUET DATA
===================================================== */

async function loadData() {

    try {


        console.log(
            'Starting Parquet loading...'
        );


        document.getElementById(
            'message'
        ).innerHTML =
            'Loading country climate data...';



        /* ---------------------------------------------
           Open Parquet file
        --------------------------------------------- */

        const file =
            await asyncBufferFromUrl({

                url:
                    'data/country_timeseries.parquet'

            });


        console.log(
            'Parquet file opened successfully'
        );



        /* ---------------------------------------------
           Read required columns
        --------------------------------------------- */

        countryData =
            await parquetReadObjects({

                file: file,

                columns: [

                    'country_id',

                    'country_name',

                    'year',

                    'P',

                    'PET',

                    'AET'

                ]

            });



        /* ---------------------------------------------
           Console information
        --------------------------------------------- */

        console.log(
            'Loaded rows:',
            countryData.length
        );


        if (countryData.length > 0) {

            console.log(
                'First row:',
                countryData[0]
            );

        }



        /* ---------------------------------------------
           Update message
        --------------------------------------------- */

        document.getElementById(
            'message'
        ).innerHTML =
            'Click a country on the map to display annual P, PET and AET.';


    }

    catch (error) {


        console.error(
            'PARQUET ERROR:',
            error
        );


        document.getElementById(
            'message'
        ).innerHTML =
            'Error loading country time-series data. Check the browser console.';


    }

}



/* =====================================================
   LOAD COUNTRY GEOJSON
===================================================== */

async function loadCountries() {

    try {


        console.log(
            'Loading country GeoJSON...'
        );


        const response =
            await fetch(
                'data/countries.geojson'
            );



        /* ---------------------------------------------
           Check HTTP response
        --------------------------------------------- */

        if (!response.ok) {

            throw new Error(

                `GeoJSON HTTP error: ${response.status}`

            );

        }



        /* ---------------------------------------------
           Convert to JSON
        --------------------------------------------- */

        const geojson =
            await response.json();



        console.log(
            'GeoJSON loaded successfully'
        );



        /* ---------------------------------------------
           Add GeoJSON to Leaflet
        --------------------------------------------- */

        L.geoJSON(

            geojson,

            {

                style: {

                    weight: 1,

                    fillOpacity: 0.2

                },


                onEachFeature:
                    function(
                        feature,
                        layer
                    ) {


                        /* -------------------------
                           Country properties
                        ------------------------- */

                        const countryId =
                            feature.properties.country_id;


                        const countryName =
                            feature.properties.country_name;



                        /* -------------------------
                           Click event
                        ------------------------- */

                        layer.on(

                            'click',

                            function() {


                                console.log(
                                    'Country clicked:',
                                    countryId,
                                    countryName
                                );


                                showCountry(

                                    countryId,

                                    countryName

                                );

                            }

                        );


                    }

            }

        ).addTo(map);


    }

    catch (error) {


        console.error(
            'GEOJSON ERROR:',
            error
        );


        document.getElementById(
            'message'
        ).innerHTML =
            'Error loading country map data.';


    }

}



/* =====================================================
   SHOW COUNTRY DATA
===================================================== */

function showCountry(

    countryId,

    countryName

) {


    /* ---------------------------------------------
       Country name
    --------------------------------------------- */

    document.getElementById(
        'countryName'
    ).innerHTML =
        countryName;



    /* ---------------------------------------------
       Filter country
    --------------------------------------------- */

    const rows =

        countryData

        .filter(

            row =>

                String(row.country_id) ===
                String(countryId)

        )

        .sort(

            (a, b) =>

                Number(a.year) -
                Number(b.year)

        );



    /* ---------------------------------------------
       Check data
    --------------------------------------------- */

    if (!rows.length) {


        document.getElementById(
            'message'
        ).innerHTML =
            'No time-series data found for this country.';


        return;

    }



    /* ---------------------------------------------
       Number of observations
    --------------------------------------------- */

    document.getElementById(
        'message'
    ).innerHTML =

        `${rows.length} annual observations`;



    /* ---------------------------------------------
       Prepare arrays
    --------------------------------------------- */

    const years =

        rows.map(

            row =>
                Number(row.year)

        );


    const P =

        rows.map(

            row =>
                Number(row.P)

        );


    const PET =

        rows.map(

            row =>
                Number(row.PET)

        );


    const AET =

        rows.map(

            row =>
                Number(row.AET)

        );



    /* ---------------------------------------------
       Remove old chart
    --------------------------------------------- */

    if (chart) {

        chart.destroy();

    }



    /* ---------------------------------------------
       Create Chart.js chart
    --------------------------------------------- */

    chart = new Chart(

        document.getElementById(
            'climateChart'
        ),

        {

            type: 'line',


            data: {

                labels: years,


                datasets: [

                    {

                        label: 'P',

                        data: P,

                        borderWidth: 2,

                        pointRadius: 0,

                        tension: 0.15

                    },


                    {

                        label: 'PET',

                        data: PET,

                        borderWidth: 2,

                        pointRadius: 0,

                        tension: 0.15

                    },


                    {

                        label: 'AET',

                        data: AET,

                        borderWidth: 2,

                        pointRadius: 0,

                        tension: 0.15

                    }

                ]

            },


            options: {

                responsive: true,

                maintainAspectRatio: false,


                interaction: {

                    mode: 'index',

                    intersect: false

                },


                scales: {

                    x: {

                        title: {

                            display: true,

                            text: 'Year'

                        }

                    },


                    y: {

                        title: {

                            display: true,

                            text: 'mm/year'

                        }

                    }

                }

            }

        }

    );

}



/* =====================================================
   START APPLICATION
===================================================== */

console.log(
    'CDEAR dashboard starting...'
);


/* Load both files */

loadData();

loadCountries();


</script>


</body>

</html>
