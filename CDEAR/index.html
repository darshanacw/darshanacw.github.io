<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDEAR - Country Climate Time Series</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/hyparquet"></script>
<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif}
#container{display:flex;height:100vh}
#map{width:50%;height:100%}
#panel{width:50%;padding:25px;box-sizing:border-box;overflow:auto}
#title{font-size:24px;font-weight:bold}
#countryName{font-size:20px;margin:10px 0 15px}
#message{color:#666;margin-bottom:20px}
.chart-container{height:420px}
.info-box{margin-top:20px;padding:12px;background:#f5f5f5;border-radius:5px}
</style>
</head>
<body>
<div id="container">
  <div id="map"></div>
  <div id="panel">
    <div id="title">CDEAR Climate Data</div>
    <div id="countryName">Select a country</div>
    <div id="message">Click a country on the map to display annual P, PET and AET.</div>
    <div class="chart-container"><canvas id="climateChart"></canvas></div>
    <div class="info-box">
      <b>Variables</b><br>
      P = Precipitation (mm/year)<br>
      PET = Potential Evapotranspiration (mm/year)<br>
      AET = Actual Evapotranspiration (mm/year)
    </div>
  </div>
</div>

<script type="module">
import { asyncBufferFromUrl, parquetReadObjects } from 'https://cdn.jsdelivr.net/npm/hyparquet@1.30.1/src/hyparquet.min.js';
import { parquetRead } from "https://cdn.jsdelivr.net/npm/hyparquet/+esm";

let map = L.map('map').setView([0, 20], 3);
let chart = null;
let countryData = [];

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// Load Parquet
async function loadData() {
  try {
    const file = await asyncBufferFromUrl({
      url: 'data/country_timeseries.parquet'
    });

    countryData = await parquetReadObjects({
      file,
      columns: ['country_id', 'country_name', 'year', 'P', 'PET', 'AET']
    });

    console.log('Loaded rows:', countryData.length);
    document.getElementById('message').innerHTML =
      'Click a country on the map to display annual P, PET and AET.';
  } catch (error) {
    console.error(error);
    document.getElementById('message').innerHTML =
      'Error loading country time-series data.';
  }
}

// Load map
fetch('data/countries.geojson')
  .then(response => response.json())
  .then(geojson => {
    L.geoJSON(geojson, {
      style: {
        weight: 1,
        fillOpacity: 0.2
      },
      onEachFeature: function(feature, layer) {
        layer.on('click', function() {
          showCountry(
            feature.properties.country_id,
            feature.properties.country_name
          );
        });
      }
    }).addTo(map);
  })
  .catch(error => console.error('GeoJSON error:', error));

function showCountry(countryId, countryName) {
  document.getElementById('countryName').innerHTML = countryName;

  const rows = countryData
    .filter(row => String(row.country_id) === String(countryId))
    .sort((a, b) => Number(a.year) - Number(b.year));

  if (!rows.length) {
    document.getElementById('message').innerHTML =
      'No time-series data found for this country.';
    return;
  }

  document.getElementById('message').innerHTML =
    `${rows.length} annual observations`;

  const years = rows.map(row => Number(row.year));
  const P = rows.map(row => Number(row.P));
  const PET = rows.map(row => Number(row.PET));
  const AET = rows.map(row => Number(row.AET));

  if (chart) chart.destroy();

  chart = new Chart(document.getElementById('climateChart'), {
    type: 'line',
    data: {
      labels: years,
      datasets: [
        {label:'P', data:P, borderWidth:2, pointRadius:0, tension:0.15},
        {label:'PET', data:PET, borderWidth:2, pointRadius:0, tension:0.15},
        {label:'AET', data:AET, borderWidth:2, pointRadius:0, tension:0.15}
      ]
    },
    options: {
      responsive:true,
      maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      scales:{
        x:{title:{display:true,text:'Year'}},
        y:{title:{display:true,text:'mm/year'}}
      }
    }
  });
}

loadData();
</script>
</body>
</html>
